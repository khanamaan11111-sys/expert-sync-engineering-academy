<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Knowledge Check | Expert Sync Engineering Academy</title><style>:root{font-family:system-ui,Arial,sans-serif;background:#081526;color:#eff8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#19425c,#081526 55%);min-height:100vh}header,main,footer{max-width:850px;margin:auto;padding:24px}a{color:#8ee8db}h1{font-size:clamp(2rem,5vw,3.2rem)}p{color:#c7d8e6;line-height:1.6}.panel{background:#10283d;border:1px solid #35536c;border-radius:16px;padding:20px;margin:18px 0}fieldset{border:1px solid #52718a;border-radius:10px;margin:15px 0;padding:15px}legend{font-weight:700;color:#8ee8db;padding:0 5px}label{display:block;margin:12px 0;cursor:pointer}input{accent-color:#8ee8db}button{background:#8ee8db;color:#081526;border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}.feedback{border-left:3px solid #8ee8db;padding-left:12px}</style></head><body><header><a id="back" href="./engineering-world-pathways.html">← Engineering World</a></header><main><h1 id="title">Engineering knowledge check</h1><p>Answer three introductory questions. Get feedback immediately. This self-check does not award a certificate or alter your four-step pathway progress.</p><div id="quiz" class="panel"></div><button id="submit" type="button" hidden>Check my answers</button><p id="previous-score" role="status" aria-live="polite"></p><div id="results" role="status" aria-live="polite"></div></main><footer>Expert Sync Engineering Academy</footer><script>
const quizzes={
civil:{name:"Civil Engineering",questions:[["What is a building foundation primarily designed to do?",["Transfer structural loads safely to the ground","Decorate the building","Generate electricity"],0,"Foundations distribute structural loads into supporting soil or rock."],["What is a common purpose of surveying?",["Measure land positions and levels","Increase concrete curing temperature","Test programming syntax"],0,"Surveying establishes positions, distances and elevations."],["In rainwater harvesting, what collects water from a roof?",["Catchment surface","Inverter","Gearbox"],0,"The roof acts as a catchment surface."]]},
eee:{name:"Electrical & Electronics Engineering",questions:[["What does a DC-DC boost converter ideally do?",["Increase DC voltage","Convert DC to mechanical rotation","Measure rainfall"],0,"A boost converter raises DC voltage under suitable operating conditions."],["Which quantity is measured in amperes?",["Electric current","Resistance","Frequency"],0,"The ampere is the SI unit of electric current."],["Why is isolation important before electrical maintenance?",["To reduce exposure to energized parts","To increase load demand","To raise switching frequency"],0,"Safe isolation helps prevent contact with live electrical energy."]]},
mechanical:{name:"Mechanical Engineering",questions:[["Which law relates force, mass and acceleration?",["Newton's second law","Ohm's law","Faraday's law"],0,"Newton's second law is commonly written F = ma."],["What is CAD used for?",["Computer-aided design","Measuring network latency","Chemical titration"],0,"CAD supports creating and modifying technical designs."],["Which component transmits motion through meshing teeth?",["Gear","Capacitor","Diode"],0,"Meshing gears transmit rotational motion and torque."]]},
cse:{name:"Computer Science Engineering",questions:[["What does a database primarily help manage?",["Organized data","Mechanical stress","Air pressure"],0,"Databases store and organize data for retrieval and updates."],["Which structure follows first-in, first-out?",["Queue","Stack","Binary tree"],0,"A queue normally serves the earliest enqueued item first."],["What is a software test intended to do?",["Check expected behavior","Increase monitor brightness","Replace all documentation"],0,"Tests check behavior against defined expectations."]]},
ece:{name:"Electronics & Communication Engineering",questions:[["What does an ADC do?",["Convert analog signals into digital values","Amplify only sound waves","Store mechanical energy"],0,"An analog-to-digital converter samples and quantizes analog input."],["What is a microcontroller?",["A programmable integrated device for embedded control","A mechanical bearing","A building foundation"],0,"Microcontrollers integrate processing and peripherals for embedded applications."],["Why use a filter in signal processing?",["To attenuate selected frequency components","To change wire color","To measure concrete strength"],0,"Filters shape a signal's frequency content."]]},
chemical:{name:"Chemical Engineering",questions:[["What does a material balance track?",["Mass entering, leaving and accumulating","Only equipment purchase price","Only motor speed"],0,"Material balances apply conservation of mass."],["What does a process flow diagram depict?",["Major equipment and process streams","Source-code indentation","Aircraft seating"],0,"A PFD shows key process units and material flows."],["Which consideration is essential in process design?",["Hazard and process safety","Font size alone","Decorative color alone"],0,"Process safety addresses hazardous conditions and controls."]]},

};const id=new URLSearchParams(location.search).get("branch"),data=Object.hasOwn(quizzes,id)?quizzes[id]:null,quiz=document.querySelector("#quiz"),submit=document.querySelector("#submit"),results=document.querySelector("#results");if(!data){quiz.textContent="Choose a valid branch from the Engineering World directory."}else{document.querySelector("#title").textContent=data.name+" — Knowledge Check";document.title=data.name+" Knowledge Check | Expert Sync Engineering Academy";document.querySelector("#back").href="./engineering-pathway.html?branch="+encodeURIComponent(id);document.querySelector("#back").textContent="← Back to "+data.name;data.questions.forEach(([question,options],i)=>{const field=document.createElement("fieldset"),legend=document.createElement("legend");legend.textContent=(i+1)+". "+question;field.append(legend);options.forEach((option,j)=>{const label=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name="q"+i;input.value=String(j);label.append(input,document.createTextNode(" "+option));field.append(label)});quiz.append(field)});const scoreKey="expert-sync-quiz-score-v1-"+id,previous=document.querySelector("#previous-score");try{const saved=JSON.parse(localStorage.getItem(scoreKey)||"null");if(saved&&Number.isInteger(saved.score)&&saved.score>=0&&saved.score<=3)previous.textContent="Previous score in this browser: "+saved.score+" of 3."}catch(e){}submit.hidden=false;submit.addEventListener("click",()=>{results.replaceChildren();let score=0;data.questions.forEach(([question,options,correct,explanation],i)=>{const selected=quiz.querySelector('input[name="q'+i+'"]:checked'),p=document.createElement("p");p.className="feedback";if(selected&&Number(selected.value)===correct){score++;p.textContent="Question "+(i+1)+": Correct. "+explanation}else p.textContent="Question "+(i+1)+": "+(selected?"Not quite. ":"No answer selected. ")+"Correct answer: "+options[correct]+". "+explanation;results.append(p)});const heading=document.createElement("h2");heading.textContent="Your score: "+score+" of "+data.questions.length;results.prepend(heading);try{localStorage.setItem(scoreKey,JSON.stringify({score,total:data.questions.length,completedAt:new Date().toISOString()}));previous.textContent="Latest score saved in this browser: "+score+" of 3."}catch(e){previous.textContent="Score could not be saved in this browser."}})}</script></body></html>
