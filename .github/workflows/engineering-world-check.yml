name: Engineering World checks
on:
  pull_request:
  push:
    branches: [feature/engineering-world-pathways-oct16]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Engineering World navigation and scripts
        run: node --test tests/engineering-world.test.cjs
